<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Нутри</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    border-bottom: 1px solid var(--card); flex: none; }
  header .ava { width: 36px; height: 36px; border-radius: 50%; background: var(--btn); color: var(--btn-text);
    display: grid; place-items: center; font-size: 18px; }
  header .t { flex: 1; min-width: 0; }
  header .t b { display: block; font-size: 16px; }
  header .t span { font-size: 12px; color: var(--hint); }
  header button { border: 0; background: transparent; color: var(--hint); font: inherit; font-size: 13px; cursor: pointer; }

  #chat { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px;
    -webkit-overflow-scrolling: touch; }
  .msg { max-width: 86%; padding: 9px 13px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.bot { align-self: flex-start; background: var(--card); border-bottom-left-radius: 6px; }
  .msg.user { align-self: flex-end; background: var(--btn); color: var(--btn-text); border-bottom-right-radius: 6px; }
  .msg .tag { display: inline-block; font-size: 11px; opacity: .7; margin-bottom: 2px; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--hint); animation: b 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes b { 0%,60%,100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

  .quick { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 8px; flex: none; }
  .quick:empty { display: none; }
  .quick button { flex: none; border: 1px solid var(--hint); background: transparent; color: var(--text);
    font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }

  .composer { flex: none; display: flex; align-items: flex-end; gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--card); background: var(--bg); }
  .composer .box { flex: 1; background: var(--card); border-radius: 22px; padding: 4px 6px 4px 14px; display: flex; align-items: flex-end; }
  textarea { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit;
    resize: none; max-height: 140px; padding: 8px 0; line-height: 1.35; }
  .ib { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; display: grid; place-items: center;
    background: var(--btn); color: var(--btn-text); font-size: 18px; cursor: pointer; }
  .ib.mic { background: transparent; color: var(--hint); width: 36px; height: 36px; }
  .ib.mic.rec { background: #e03131; color: #fff; animation: p 1.2s infinite; }
  @keyframes p { 0% { box-shadow: 0 0 0 0 rgba(224,49,49,.5); } 100% { box-shadow: 0 0 0 12px rgba(224,49,49,0); } }
  .ib[hidden] { display: none; }
  .disclaimer { text-align: center; font-size: 11px; color: var(--hint); padding: 0 12px 6px; flex: none; }
</style>
</head>
<body>
<header>
  <div class="ava">🥗</div>
  <div class="t"><b>Нутри</b><span id="status">нутрициолог-ассистент</span></div>
  <button id="reset" title="Начать заново">Очистить</button>
</header>

<div id="chat" aria-live="polite"></div>
<div class="quick" id="quick"></div>
<div class="disclaimer">Не медицинская рекомендация. Переписка хранится только на вашем устройстве.</div>

<div class="composer">
  <div class="box">
    <textarea id="input" rows="1" placeholder="Напишите или наговорите…" enterkeyhint="send"></textarea>
    <button class="ib mic" id="mic" type="button" aria-label="Голосовой ввод">🎤</button>
  </div>
  <button class="ib" id="send" type="button" aria-label="Отправить" hidden>➤</button>
</div>

<script>
/* ======================================================================
   НАСТРОЙКИ — ЗДЕСЬ ПИШЕТЕ ВЫ
   ====================================================================== */
const GREETING =
  "Привет! Я Нутри. Расскажите о себе: возраст, рост, вес, активность, цель, аллергии. " +
  "Затем пришлите рецепт из видео и напишите, как себя чувствуете. Можно текстом или голосом.";

const QUICK_REPLIES = [
  "Мне 30 лет, жен, 165 см, 60 кг, активность умеренная",
  "Вот рецепт из видео:",
  "Сегодня мёрзну",
  "Вчера переел(а)"
];

// Адрес облачной функции с ИИ (тот же, что на сайте). Пусто = демо-ответ.
const AI_ENDPOINT = "";
const DEMO_REPLY = "Это демо-версия: ИИ подключаем на следующем шаге, поэтому ответ шаблонный.";

// history = [{role:"user"|"assistant", text:"..."}], последнее сообщение пользователя уже внутри.
async function getReply(history) {
  if (!AI_ENDPOINT) { await new Promise(r => setTimeout(r, 700)); return DEMO_REPLY; }
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 35000);
  try {
    const r = await fetch(AI_ENDPOINT, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" }, signal: ctrl.signal,
      body: JSON.stringify({ messages: history.slice(-16), anon_id: store.get("anon_id"), utm: store.get("first_utm", null), source: "telegram" })
    });
    const j = await r.json().catch(() => ({}));
    if (r.status === 429) return j.reply || "На сегодня лимит сообщений исчерпан. Возвращайтесь завтра!";
    if (!r.ok || !j.reply) throw new Error("HTTP " + r.status);
    return j.reply;
  } finally { clearTimeout(timer); }
}

/* ---------- Telegram ---------- */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const haptic = (t) => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t || "light"); } catch (e) {} };

/* ---------- Хранилище и аналитика (без сервера) ---------- */
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function track(name, props) {
  const today = new Date().toISOString().slice(0, 10);
  const days = store.get("visit_days", []);
  if (!days.includes(today)) { days.push(today); store.set("visit_days", days); }
  if (!store.get("anon_id")) store.set("anon_id", Math.random().toString(36).slice(2) + Date.now().toString(36));
  console.log("[event]", name, props || {}, { anon: store.get("anon_id"), days: days.length });
}
// Метка выпуска из QR: ссылка вида t.me/ВашБот/app?startapp=ep1 → start_param = "ep1"
(function captureStart() {
  const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (sp && !store.get("first_utm")) store.set("first_utm", { utm_source: "telegram", utm_content: sp });
})();
track("open", { in_telegram: !!tg, start: store.get("first_utm", null) });

/* ---------- Чат ---------- */
const $ = (id) => document.getElementById(id);
const chat = $("chat"), input = $("input"), sendBtn = $("send"), micBtn = $("mic");
let history = store.get("history", []);
let busy = false;

function addBubble(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot");
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function renderAll() {
  chat.innerHTML = "";
  if (!history.length) addBubble("assistant", GREETING);
  history.forEach(m => addBubble(m.role, m.text));
  renderQuick();
}
function renderQuick() {
  const q = $("quick"); q.innerHTML = "";
  if (history.length) return;
  QUICK_REPLIES.forEach(t => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = t;
    b.onclick = () => { input.value = t; autosize(); input.focus(); toggleSend(); };
    q.appendChild(b);
  });
}
async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  stopVoice();
  busy = true;
  input.value = ""; autosize(); toggleSend();
  history.push({ role: "user", text }); store.set("history", history);
  $("quick").innerHTML = "";
  addBubble("user", text);
  haptic();
  track("message_sent", { n: history.filter(m => m.role === "user").length, len: text.length });

  const typing = addBubble("assistant", "");
  typing.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  let reply;
  try { reply = await getReply(history); } catch (e) { reply = "Не получилось ответить. Попробуйте ещё раз через минуту."; track("chat_error", { msg: String(e).slice(0, 120) }); }
  typing.textContent = reply;
  history.push({ role: "assistant", text: reply }); store.set("history", history);
  chat.scrollTop = chat.scrollHeight;
  busy = false;
}
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }
function toggleSend() {
  const has = input.value.trim().length > 0;
  sendBtn.hidden = !has;
}
input.addEventListener("input", () => { autosize(); toggleSend(); });
input.addEventListener("keydown", (e) => {
  // На телефоне Enter = новая строка; отправка кнопкой. На компьютере Enter отправляет.
  if (e.key === "Enter" && !e.shiftKey && !/Android|iPhone|iPad/i.test(navigator.userAgent)) { e.preventDefault(); send(); }
});
sendBtn.onclick = send;
$("reset").onclick = () => {
  if (!history.length || confirm("Очистить переписку?")) { history = []; store.set("history", []); renderAll(); }
};

/* ---------- Голосовой ввод ----------
   Используем распознавание речи браузера (Web Speech API). Оно есть не везде:
   в части версий Telegram на телефоне его нет. Тогда подсказываем микрофон на клавиатуре. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recOn = false, baseText = "";
function startVoice() {
  if (!SR) {
    addBubble("assistant", "Голосовой ввод здесь недоступен. Нажмите значок микрофона на клавиатуре телефона и наговорите сообщение.");
    track("voice_unsupported"); return;
  }
  rec = new SR(); rec.lang = "ru-RU"; rec.interimResults = true; rec.continuous = true;
  baseText = input.value ? input.value.trim() + " " : "";
  rec.onresult = (e) => {
    let t = ""; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    input.value = baseText + t; autosize(); toggleSend();
  };
  rec.onerror = (e) => {
    stopVoice();
    if (e.error === "not-allowed" || e.error === "service-not-allowed")
      addBubble("assistant", "Нет доступа к микрофону. Разрешите его в настройках или используйте микрофон на клавиатуре.");
  };
  rec.onend = () => { recOn = false; micBtn.classList.remove("rec"); };
  try { rec.start(); recOn = true; micBtn.classList.add("rec"); haptic("medium"); track("voice_start"); }
  catch (e) { stopVoice(); }
}
function stopVoice() { try { rec && rec.stop(); } catch (e) {} recOn = false; micBtn.classList.remove("rec"); }
micBtn.onclick = () => recOn ? stopVoice() : startVoice();

/* ---------- Старт ---------- */
renderAll(); toggleSend();
</script>
</body>
</html>
