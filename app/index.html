<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Нутри</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Загружаем только буквы приветствия: шрифт весит пару килобайт -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&text=%D0%A7%D1%82%D0%BE%20%D0%B3%D0%BE%D1%82%D0%BE%D0%B2%D0%B8%D0%BC%20%D1%81%D0%B5%D0%B3%D0%BE%D0%B4%D0%BD%D1%8F%3F&display=swap" rel="stylesheet">
<style>
:root{
  /* Светлая тема: тёплая палитра бренда */
  --bg:#FBF8F1; --surface:#FFFFFF; --surface-2:#F3EEE2; --line:rgba(35,41,27,.10);
  --text:#23291B; --text-2:#5C6250; --hint:#8C8F7E;
  --accent:#4A5D23; --accent-press:#3B4B1B; --on-accent:#FBF8F1; --accent-soft:#E7EBDA;
  --warm:#F6E2D4; --warm-ink:#8A3E12; --mint:#E2F2E9; --mint-ink:#1F5E43; --sky:#E8EEF3; --sky-ink:#34434B; --honey:#F7EBD3; --honey-ink:#7A4D0E;
  --danger:#C2412D;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-top:max(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px), env(safe-area-inset-top,0px));
  --safe-bottom:max(var(--tg-safe-area-inset-bottom,0px), env(safe-area-inset-bottom,0px));
}
html.dark{
  /* Тёмная тема: оливково-графитовая, акцент светлее для контраста */
  --bg:#12160F; --surface:#1B2117; --surface-2:#232A1E; --line:rgba(237,239,230,.09);
  --text:#EDEFE6; --text-2:#B9BEAD; --hint:#878D79;
  --accent:#B5CC7E; --accent-press:#A2BA6A; --on-accent:#1A2310; --accent-soft:#2A3320;
  --warm:#3A2A20; --warm-ink:#F3C6A6; --mint:#1D3128; --mint-ink:#A9DEC2; --sky:#22292E; --sky-ink:#C5D3DC; --honey:#352B19; --honey-ink:#F0CF92;
  --danger:#F08A76;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{position:fixed;inset:0;height:var(--tg-viewport-height,100dvh);display:flex;flex-direction:column;padding-top:var(--safe-top)}

/* Шапка */
.top{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 14px;transition:border-color .2s;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.ava{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.ava .ico{width:19px;height:19px}
.ttl{flex:1;min-width:0;line-height:1.2}
.ttl b{display:block;font-size:16px;font-weight:600}
.ttl span{font-size:13px;color:var(--hint);display:flex;align-items:center;gap:5px}
.ttl span i{width:6px;height:6px;border-radius:50%;background:#3FA36F}
.ttl span.typing-st{color:var(--accent)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);transition:background .15s}
.icon-btn:active{background:var(--surface-2)}

/* Лента */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.feed{padding:6px 16px 18px;display:flex;flex-direction:column;gap:14px;min-height:100%}

/* Приветствие */
.welcome{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 0 6px;gap:20px}
.hello{display:grid;justify-items:center;text-align:center;gap:10px}
.hello .mark{width:64px;height:64px;border-radius:22px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 0 0 8px var(--accent-soft)}
.hello .mark .ico{width:32px;height:32px;stroke-width:1.6}
.hello h1{margin:10px 0 0;font:italic 500 30px/1.1 var(--serif);letter-spacing:-.01em}
.hello p{margin:0;color:var(--text-2);font-size:15px;max-width:30ch}
.ep-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 12px 12px 14px;text-align:left;width:100%}
.ep-card .ep-ico{width:42px;height:42px;border-radius:12px;background:var(--honey);color:var(--honey-ink);display:grid;place-items:center;flex:none}
.ep-card div{flex:1;min-width:0}
.ep-card small{display:block;font-size:12px;color:var(--hint)}
.ep-card b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-card .go{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.ep-card .go .ico{width:18px;height:18px}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sg{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;border-radius:18px;padding:14px;min-height:108px;background:var(--surface);border:1px solid var(--line);transition:transform .12s}
.sg:active{transform:scale(.97)}
.sg .si{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.sg .si .ico{width:19px;height:19px}
.sg b{font-size:15px;font-weight:600;line-height:1.25}
.sg span{font-size:13px;color:var(--hint);line-height:1.3;margin-top:-4px}
.t-mint .si{background:var(--mint);color:var(--mint-ink)}
.t-warm .si{background:var(--warm);color:var(--warm-ink)}
.t-sky .si{background:var(--sky);color:var(--sky-ink)}
.t-olive .si{background:var(--accent-soft);color:var(--accent)}
.note{font-size:12px;color:var(--hint);text-align:center}

/* Сообщения */
.msg-user{align-self:flex-end;max-width:84%;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:20px 20px 6px 20px;white-space:pre-wrap;word-wrap:break-word;animation:up .22s ease-out}
.msg-bot{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;animation:up .22s ease-out}
.msg-bot .ava{width:28px;height:28px;margin-top:2px}
.msg-bot .ava .ico{width:15px;height:15px}
.msg-bot .body{min-width:0}
.msg-bot .txt b{font-weight:600}
.msg-bot .txt{white-space:pre-wrap;word-wrap:break-word;font-size:16px;line-height:1.5}
.msg-bot.err .txt{color:var(--danger)}
.acts{display:flex;gap:2px;margin:6px 0 0 -8px}
.acts button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--hint)}
.acts button:active{background:var(--surface-2)}
.acts button.on{color:var(--accent)}
.acts .ico{width:18px;height:18px}
.retry{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--accent);padding:8px 12px;border-radius:12px;background:var(--accent-soft)}
.dots{display:inline-flex;gap:5px;padding:8px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--hint);animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.home-card{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:18px;padding:12px 14px;animation:up .22s ease-out}
.home-card div{flex:1;font-size:14px;line-height:1.35}
.home-card b{display:block;font-size:15px}
.home-card button{flex:none;font-weight:600;font-size:14px;color:var(--on-accent);background:var(--accent);padding:9px 14px;border-radius:12px}
.home-card .x{background:none;color:var(--hint);padding:6px}

/* Поле ввода */
.dock{flex:none;padding:8px 12px calc(10px + var(--safe-bottom));background:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips:empty{display:none}
.chips button{flex:none;white-space:nowrap;font-size:14px;padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--text)}
.bar{display:flex;align-items:flex-end;gap:8px}
.field{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:3px 4px 3px 16px;transition:border-color .15s}
.field:focus-within{border-color:var(--accent)}
.field textarea{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;color:var(--text);font:16px/1.35 var(--sans);resize:none;max-height:132px;padding:10px 0}
.field textarea::placeholder{color:var(--hint)}
.mic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);flex:none}
.send{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);flex:none;transition:transform .15s,opacity .15s}
.send:active{transform:scale(.92)}
.send[hidden]{display:none}
.rec-on .field{border-color:var(--danger)}
.rec-on .mic{background:var(--danger);color:#fff;animation:ring 1.3s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(194,65,45,.45)}100%{box-shadow:0 0 0 12px rgba(194,65,45,0)}}
.rec-hint{display:none;align-items:center;gap:8px;font-size:13px;color:var(--danger);padding:0 6px 6px}
.rec-on .rec-hint{display:flex}
.rec-hint i{width:8px;height:8px;border-radius:50%;background:var(--danger);animation:bl 1s infinite}

.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-bottom));transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);font-size:14px;padding:9px 14px;border-radius:12px;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 6-13 15-13-1 9-6 14-13 14"/><path d="M5 20l8-8"/></symbol>
  <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5-11-6.5Z"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-bowl" viewBox="0 0 24 24"><path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
  <symbol id="i-like" viewBox="0 0 24 24"><path d="M7 11v9H4v-9h3Zm0 0 4-7a2 2 0 0 1 2 2v4h5a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 16.8 20H7"/></symbol>
  <symbol id="i-dislike" viewBox="0 0 24 24"><path d="M17 13V4h3v9h-3Zm0 0-4 7a2 2 0 0 1-2-2v-4H6a2 2 0 0 1-2-2.3l1.2-6A2 2 0 0 1 7.2 4H17"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></symbol>
</svg>

<div class="app" id="app">
  <header class="top" id="top">
    <span class="ava"><svg class="ico"><use href="#i-leaf"/></svg></span>
    <div class="ttl"><b>Нутри</b><span id="status"><i></i>ИИ-нутрициолог</span></div>
    <button class="icon-btn" id="newChat" aria-label="Новый разговор"><svg class="ico"><use href="#i-new"/></svg></button>
  </header>

  <main class="scroll" id="scroll">
    <div class="feed" id="feed"></div>
  </main>

  <footer class="dock" id="dock">
    <div class="chips" id="chips"></div>
    <div class="rec-hint"><i></i>Слушаю… нажмите микрофон, чтобы закончить</div>
    <div class="bar">
      <div class="field">
        <textarea id="input" rows="1" placeholder="Сообщение" enterkeyhint="send" aria-label="Сообщение"></textarea>
        <button class="mic" id="mic" type="button" aria-label="Голосовой ввод"><svg class="ico"><use href="#i-mic"/></svg></button>
      </div>
      <button class="send" id="send" type="button" aria-label="Отправить" hidden><svg class="ico"><use href="#i-up"/></svg></button>
    </div>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* ======================================================================
   НАСТРОЙКИ — ЗАПОЛНЯЕТ КОМАНДА
   ====================================================================== */
const AI_ENDPOINT = "";   // адрес облачной функции, тот же, что на сайте. Пусто = демо-ответ
const DEMO_REPLY = "Это демо-версия: ИИ подключаем на следующем шаге, поэтому ответ шаблонный.";

// Названия выпусков для карточки «Вы из выпуска…». Ключ — метка из QR: t.me/ВашБот/app?startapp=ep1
const EPISODES = {
  ep1: "Выпуск 1 · [название блюда]",
  ep2: "Выпуск 2 · [название блюда]"
};

// Карточки на стартовом экране: одно касание — и вопрос отправлен
const SUGGESTIONS = [
  { tone: "t-olive", icon: "i-bowl",   title: "Блюдо из выпуска", sub: "пересчитать под меня", text: "Хочу приготовить блюдо из последнего выпуска под себя. Что нужно обо мне знать?" },
  { tone: "t-warm",  icon: "i-sun",    title: "Мёрзну или тяжесть", sub: "специи и подача", text: "Сегодня мёрзну и чувствую тяжесть. Как лучше приготовить и подать блюдо?" },
  { tone: "t-mint",  icon: "i-plus",   title: "Добрать белок", sub: "чем дополнить блюдо", text: "Как добавить в блюдо больше белка без лишних калорий?" },
  { tone: "t-sky",   icon: "i-shield", title: "Есть аллергия", sub: "найти замену", text: "У меня аллергия. Помоги заменить ингредиенты в рецепте." }
];

// Подсказки над полем ввода в начале разговора
const CHIPS = ["Мне 34, 70 кг, бегаю 3 раза в неделю", "Хочу похудеть", "Не ем мясо", "Без глютена"];

/* ---------- Telegram ---------- */
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined ? window.Telegram.WebApp : null;
const inTg = !!(tg && tg.platform && tg.platform !== "unknown");
const ver = v => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));
const haptic = {
  tap()    { try { tg.HapticFeedback.impactOccurred("light"); } catch (e) {} },
  select() { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} },
  ok()     { try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {} },
  err()    { try { tg.HapticFeedback.notificationOccurred("error"); } catch (e) {} }
};

function applyTheme() {
  const dark = inTg && tg.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.classList.toggle("dark", dark);
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  if (!inTg) return;
  // Красим шапку и нижнюю панель Telegram в цвет приложения — без «шва»
  try { if (ver("6.1")) { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } } catch (e) {}
  try { if (ver("7.10")) tg.setBottomBarColor(bg); } catch (e) {}
}
applyTheme();
if (inTg) {
  tg.ready();
  tg.expand();
  try { if (ver("7.7")) tg.disableVerticalSwipes(); } catch (e) {}   // чтобы прокрутка чата не закрывала приложение
  tg.onEvent && tg.onEvent("themeChanged", applyTheme);
} else {
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
}

/* ---------- Хранилище и аналитика ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
if (!store.get("anon_id")) store.set("anon_id", Math.random().toString(36).slice(2) + Date.now().toString(36));
(function captureStart() {
  const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (sp) store.set("last_start", sp);
  if (sp && !store.get("first_utm")) store.set("first_utm", { utm_source: "telegram", utm_content: sp });
})();
function track(name, props) {
  const today = new Date().toISOString().slice(0, 10);
  const days = store.get("visit_days", []);
  if (!days.includes(today)) { days.push(today); store.set("visit_days", days); }
  console.log("[event]", name, Object.assign({}, props || {}, { anon: store.get("anon_id"), days: days.length, start: store.get("first_utm", null) }));
}
track("open", { in_telegram: inTg, platform: tg && tg.platform, version: tg && tg.version });

/* ---------- Состояние ---------- */
const $ = id => document.getElementById(id);
const feed = $("feed"), scrollEl = $("scroll"), input = $("input"), sendBtn = $("send"), micBtn = $("mic");
const HKEY = "nutri_tg_history";
let history = store.get(HKEY, []);   // [{role:"user"|"assistant", text, fb?, err?}]
let busy = false;

/* ---------- Отрисовка ---------- */
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
const icon = id => `<svg class="ico"><use href="#${id}"/></svg>`;

function render() {
  feed.innerHTML = "";
  if (!history.length) renderWelcome();
  history.forEach((m, i) => feed.appendChild(m.role === "user" ? userMsg(m.text) : botMsg(m, i)));
  renderChips();
  toBottom(false);
}
function renderWelcome() {
  const w = el("section", "welcome");
  const hello = el("div", "hello",
    `<span class="mark">${icon("i-leaf")}</span><h1>Что готовим сегодня?</h1>
     <p>Подстрою блюдо из выпуска под вас: порция, белок, специи и подача по самочувствию.</p>`);
  w.appendChild(hello);
  const ep = store.get("last_start");
  if (ep) {
    const card = el("button", "ep-card",
      `<span class="ep-ico">${icon("i-play")}</span><div><small>Вы пришли из выпуска</small><b></b></div><span class="go">${icon("i-arrow")}</span>`);
    card.querySelector("b").textContent = EPISODES[ep] || ep;
    card.onclick = () => { haptic.select(); track("episode_card", { ep }); send(`Хочу приготовить блюдо из выпуска «${EPISODES[ep] || ep}» под себя.`); };
    w.appendChild(card);
  }
  const grid = el("div", "sugg");
  SUGGESTIONS.forEach(s => {
    const b = el("button", "sg " + s.tone, `<span class="si">${icon(s.icon)}</span><b></b><span></span>`);
    b.querySelector("b").textContent = s.title; b.querySelector("span:last-child").textContent = s.sub;
    b.onclick = () => { haptic.select(); track("suggestion", { title: s.title }); send(s.text); };
    grid.appendChild(b);
  });
  w.appendChild(grid);
  w.appendChild(el("p", "note", "Не заменяет консультацию врача"));
  feed.appendChild(w);
}
function userMsg(text) { const d = el("div", "msg-user"); d.textContent = text; return d; }
function botMsg(m, i) {
  const d = el("div", "msg-bot" + (m.err ? " err" : ""), `<span class="ava">${icon("i-leaf")}</span><div class="body"><div class="txt"></div></div>`);
  fillText(d.querySelector(".txt"), m.text);
  const body = d.querySelector(".body");
  if (m.err) {
    const r = el("button", "retry", icon("i-retry") + "Повторить");
    r.onclick = () => retry(i);
    body.appendChild(r);
  } else if (m.text) {
    const a = el("div", "acts",
      `<button data-a="copy" aria-label="Скопировать">${icon("i-copy")}</button>
       <button data-a="up" aria-label="Полезно" class="${m.fb === "up" ? "on" : ""}">${icon("i-like")}</button>
       <button data-a="down" aria-label="Не помогло" class="${m.fb === "down" ? "on" : ""}">${icon("i-dislike")}</button>`);
    a.onclick = e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.a === "copy") { copy(m.text); return; }
      m.fb = m.fb === b.dataset.a ? null : b.dataset.a; store.set(HKEY, history);
      a.querySelectorAll("[data-a=up],[data-a=down]").forEach(x => x.classList.toggle("on", x.dataset.a === m.fb));
      haptic.select(); track("feedback", { value: m.fb, msg_index: i });
      if (m.fb) toast(m.fb === "up" ? "Спасибо, учтём" : "Спасибо, передадим врачу");
    };
    body.appendChild(a);
  }
  return d;
}
// Короткие строки с двоеточием в конце («Что добавить:») выделяем как подзаголовки
function fillText(node, text) {
  text.split("\n").forEach((line, i) => {
    if (i) node.appendChild(document.createTextNode("\n"));
    if (/^[^—\-•\d].{1,40}:$/.test(line.trim())) { const b = document.createElement("b"); b.textContent = line; node.appendChild(b); }
    else node.appendChild(document.createTextNode(line));
  });
}
function typingMsg() { return el("div", "msg-bot", `<span class="ava">${icon("i-leaf")}</span><div class="body"><span class="dots"><i></i><i></i><i></i></span></div>`); }
function renderChips() {
  const c = $("chips"); c.innerHTML = "";
  const userCount = history.filter(m => m.role === "user").length;
  if (userCount !== 1) return;
  CHIPS.forEach(t => {
    const b = el("button"); b.type = "button"; b.textContent = t;
    b.onclick = () => { haptic.select(); input.value = (input.value ? input.value.trim() + ", " : "") + t; autosize(); toggleSend(); input.focus(); };
    c.appendChild(b);
  });
}
function toBottom(smooth) { requestAnimationFrame(() => scrollEl.scrollTo({ top: scrollEl.scrollHeight, behavior: smooth ? "smooth" : "auto" })); }
function setStatus(typing) {
  const s = $("status");
  s.className = typing ? "typing-st" : "";
  s.innerHTML = typing ? "печатает…" : "<i></i>ИИ-нутрициолог";
}
scrollEl.addEventListener("scroll", () => $("top").classList.toggle("scrolled", scrollEl.scrollTop > 4), { passive: true });

/* ---------- Сервер ---------- */
async function getReply(hist) {
  if (!AI_ENDPOINT) { await new Promise(r => setTimeout(r, 900)); return DEMO_REPLY; }
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 35000);
  try {
    const r = await fetch(AI_ENDPOINT, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" }, signal: ctrl.signal,
      body: JSON.stringify({
        messages: hist.filter(m => !m.err).map(m => ({ role: m.role, text: m.text })).slice(-16),
        anon_id: store.get("anon_id"), utm: store.get("first_utm", null), source: "telegram"
      })
    });
    const j = await r.json().catch(() => ({}));
    if (r.status === 429) return j.reply || "На сегодня лимит сообщений исчерпан. Возвращайтесь завтра!";
    if (!r.ok || !j.reply) throw new Error("HTTP " + r.status);
    return j.reply;
  } finally { clearTimeout(timer); }
}

/* ---------- Отправка ---------- */
async function send(textArg) {
  const text = (textArg != null ? textArg : input.value).trim();
  if (!text || busy) return;
  stopVoice();
  if (textArg == null) { input.value = ""; autosize(); toggleSend(); }
  if (!history.length) feed.innerHTML = "";          // убираем приветствие
  history.push({ role: "user", text }); store.set(HKEY, history);
  feed.appendChild(userMsg(text)); renderChips();
  haptic.tap();
  track("chat_message", { n: history.filter(m => m.role === "user").length, len: text.length, demo: !AI_ENDPOINT });
  await ask();
}
async function ask() {
  busy = true; setStatus(true);
  const t = typingMsg(); feed.appendChild(t); toBottom(true);
  let m;
  try { m = { role: "assistant", text: await getReply(history) }; haptic.ok(); }
  catch (e) { m = { role: "assistant", text: "Не получилось ответить. Проверьте интернет и попробуйте ещё раз.", err: true }; haptic.err(); track("chat_error", { msg: String(e).slice(0, 120) }); }
  t.remove();
  history.push(m); store.set(HKEY, history);
  feed.appendChild(botMsg(m, history.length - 1));
  busy = false; setStatus(false); toBottom(true);
  maybeHomeScreen();
}
function retry(i) {
  if (busy) return;
  history.splice(i, 1); store.set(HKEY, history);
  feed.children[feed.children.length - 1] && feed.lastElementChild.remove();
  haptic.tap(); track("chat_retry");
  ask();
}

/* ---------- «На главный экран» — повышает возвращаемость ---------- */
function maybeHomeScreen() {
  const bots = history.filter(m => m.role === "assistant" && !m.err).length;
  if (bots !== 2 || store.get("home_prompted") || !inTg || !ver("8.0") || !tg.addToHomeScreen) return;
  const show = () => {
    store.set("home_prompted", true);
    const c = el("div", "home-card", `<span class="ava">${icon("i-home")}</span><div><b>Нутри на главном экране</b>Открывать в одно касание</div><button>Добавить</button><button class="x" aria-label="Скрыть">✕</button>`);
    c.querySelector("button").onclick = () => { track("home_screen_add"); tg.addToHomeScreen(); c.remove(); };
    c.querySelector(".x").onclick = () => { track("home_screen_dismiss"); c.remove(); };
    feed.appendChild(c); toBottom(true);
  };
  try { tg.checkHomeScreenStatus(s => { if (s === "missed" || s === "unknown") show(); }); } catch (e) {}
}

/* ---------- Поле ввода ---------- */
function autosize() { if (!input.value) { input.style.height = ""; return; } input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 132) + "px"; }
function toggleSend() { const has = !!input.value.trim(); sendBtn.hidden = !has; }
input.addEventListener("input", () => { autosize(); toggleSend(); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); send(); }
});
input.addEventListener("focus", () => setTimeout(() => toBottom(true), 300));
sendBtn.addEventListener("click", () => send());

/* ---------- Новый разговор ---------- */
function newChat() {
  if (!history.length) return;
  const reset = ok => { if (!ok) return; history = []; store.set(HKEY, []); render(); track("chat_reset"); };
  if (inTg && ver("6.2")) tg.showConfirm("Начать новый разговор? Текущая переписка удалится.", reset);
  else reset(confirm("Начать новый разговор?"));
}
$("newChat").addEventListener("click", () => { haptic.tap(); newChat(); });
if (inTg && ver("7.0")) { try { tg.SettingsButton.show(); tg.SettingsButton.onClick(newChat); } catch (e) {} }

/* ---------- Копирование и уведомления ---------- */
function toast(t) { const x = $("toast"); x.textContent = t; x.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => x.classList.remove("show"), 1600); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = el("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  haptic.select(); toast("Скопировано"); track("copy");
}

/* ---------- Голос (распознавание речи устройства) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recOn = false, base = "";
function startVoice() {
  if (!SR) {
    toast("Нажмите микрофон на клавиатуре и наговорите");
    input.focus(); track("voice_unsupported"); return;
  }
  rec = new SR(); rec.lang = "ru-RU"; rec.interimResults = true; rec.continuous = true;
  base = input.value ? input.value.trim() + " " : "";
  rec.onresult = e => { let t = ""; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; input.value = base + t; autosize(); toggleSend(); };
  rec.onerror = e => { stopVoice(); if (e.error === "not-allowed" || e.error === "service-not-allowed") toast("Нет доступа к микрофону"); };
  rec.onend = () => stopVoice();
  try { rec.start(); recOn = true; document.getElementById("dock").classList.add("rec-on"); haptic.tap(); track("voice_start"); }
  catch (e) { stopVoice(); }
}
function stopVoice() {
  try { rec && recOn && rec.stop(); } catch (e) {}
  recOn = false; document.getElementById("dock").classList.remove("rec-on");
}
micBtn.addEventListener("click", () => recOn ? stopVoice() : startVoice());

render(); toggleSend();
</script>
</body>
